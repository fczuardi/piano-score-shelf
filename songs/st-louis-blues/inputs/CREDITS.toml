note = "Recorded January 28–31, 1997. Strong evidence supports US public-domain status: the Air Force distributes the track through its Public Domain Music collection, and Wikimedia Commons records the Air Force's representation that the transcription, performance, and recording are official-duty federal works. This is an evidence-based US conclusion, not an unconditional legal guarantee or a claim about other jurisdictions. The local file is Commons' 2022 fixed revision (SHA-256 e57e500bea9c1eedbfdd2fb2879aed657bbab5c94aa83911210da499d0797f90). The Defense.gov file is byte-identical to Commons' original 2021 upload (SHA-256 e4ed79423feb70445a681a516f9706ce925d5b4a2e5110c39a8f72749f6ff349). In an uploader-supplied YouTube Studio screenshot dated 2026-10-03, Content ID identifies a 14-second use of this track (video time 2:41:23–2:41:37) as St. Louis Blues March by Glenn Miller Orchestra, claimed by PONYCANYON, UMG on behalf of GRP; the uploader's dispute is under review. Content ID is an automated matching and claims system, not a determination of copyright ownership; the claim does not change the documented identity or federal-work provenance of this distinct 1997 USAF recording."

