[work]
slug = "st-louis-blues"
title = "St. Louis Blues"
creators = ["W. C. Handy"]
summary = "Sheet music and a historical reference recording for study."
research_date = "2026-10-02"
rights_note = "The evidence supports US public-domain use of the score editions and the 1921, 1922, and 1925 recordings listed as reviewed here. IMSLP marks file #716402 and its 1914 Handy Bros. material Public Domain; the downloaded file contains two six-page issues that are displayed separately. Duke marks its six-image Rudy Vallée promotional edition as Free Re-Use and No Copyright - United States, with attribution to Duke University Libraries. The Library of Congress states that US sound recordings published from 1923 through 1946 are protected for 100 years; the 1925 recordings therefore entered the US public domain on January 1, 2026. Project Gutenberg also explicitly identifies the Ferera and Paaluhi recording as public domain in the USA. Recording and publication dates are distinct. The linked Bessie Smith Archive.org transfer has no declared license, so it is linked rather than locally republished. Copyright status may differ outside the United States."

[[score_editions]]
title = "Handy Bros. scenic-cover issue"
source = "imslp-score-716402"
artifacts = ["imslp-716402-page-1", "imslp-716402-page-2", "imslp-716402-page-3", "imslp-716402-page-4", "imslp-716402-page-5", "imslp-716402-page-6"]
note = "The first six pages of IMSLP #716402: scenic front cover, four score pages, and an advertising back cover. IMSLP catalogs the containing PDF as a 1914 first edition."

[[score_editions]]
title = "Paul Whiteman promotional issue"
source = "imslp-score-716402"
artifacts = ["imslp-716402-page-7", "imslp-716402-page-8", "imslp-716402-page-9", "imslp-716402-page-10", "imslp-716402-page-11", "imslp-716402-page-12"]
note = "The second six pages bundled in IMSLP #716402: Paul Whiteman front cover, four score pages, and an advertising back cover. It is kept distinct from the scenic-cover issue even though IMSLP distributes both in one PDF."

[[score_editions]]
title = "Handy Bros. revised edition"
source = "score-archive"
artifacts = ["score-pdf-page-1", "score-pdf-page-2", "score-pdf-page-3", "score-pdf-page-4"]
note = "Four-page revised edition with ukulele arrangement. These JPEGs are display derivatives rendered from the preserved PDF at 150 DPI with Poppler pdftoppm; the PDF remains the canonical downloaded artifact."

[[score_editions]]
title = "Rudy Vallée promotional edition"
source = "duke-score"
artifacts = ["duke-score-page-1", "duke-score-page-2", "duke-score-page-3", "duke-score-page-4", "duke-score-page-5", "duke-score-page-6"]
note = "Six-page voice, piano, and ukulele edition: illustrated front cover, four score pages, and an advertising back cover. Duke dates the underlying work to 1914; this physical edition is later and remains undated here pending further research."

[[arrangements]]
title = "St. Louis Blues for piano"
