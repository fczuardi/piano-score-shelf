[[sources]]
id = "fuld-world-famous-music"
title = "James J. Fuld: The Book of World-Famous Music, 3rd edition — St. Louis Blues entry"
url = "https://www.worldradiohistory.com/BOOKSHELF-ARH/Radio-Programming/The-Book-of-World-Famous-Music-Fuld-3rd-1985.pdf"
retrieved = "2026-10-10"
snapshot_note = "The entry on page 527 dates publication to September 11, 1914 and describes the first edition as having a blue-and-white cover with the phrases 'The First Successful Blues Published' and 'The Most Widely Known Ragtime Composition,' identifying Handy as composer of The Memphis Blues, showing a 50-cent price, placing the music on pages 2–5, crediting copyright to the composer, and advertising Your Easy Rider on the back cover. Those features match the Washington University copy. The match supports an apparent-first-edition identification but does not establish its precise printing or impression."

