[[reviewed_recordings]]
title = "St. Louis Blues (30-second excerpt)"
performer = "Handy's Memphis Blues Band"
date = "1922-01"
audio_label = "Handy's Memphis Blues Band (1922) — 30-second LOC excerpt"
source = "handy-1922-loc-listening"
local_artifact = "recording-1922-handy-loc-excerpt-mp3"
note = "LOC National Recording Registry excerpt from Handy’s January 1922 New York session; 30 seconds, not the full recording. Retrieved from an April 5, 2025 Wayback capture of LOC’s MP3 because the live endpoint returned HTTP 403. The session’s St. Louis Blues was issued on Paramount 20098, matrix 970; UCSB’s Black Swan discography documents the corresponding Black Swan 2053 issue, take 2, by May 20, 1922. LOC does not identify the excerpt’s exact take or source disc. Publication evidence supports a U.S. public-domain assessment for this historical session; the specific take remains unverified."

