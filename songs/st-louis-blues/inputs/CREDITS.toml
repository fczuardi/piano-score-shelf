[[facts]]
text = "W. C. Handy is the composer and lyricist."
sources = ["score-archive", "score-rights", "recording-catalog"]

[[facts]]
text = "The locally preserved 1997 Air Force recording is Wikimedia Commons' fixed 2022 revision. The Defense.gov MP3 (SHA-256 e4ed79423feb70445a681a516f9706ce925d5b4a2e5110c39a8f72749f6ff349) matches Commons' original 2021 upload byte for byte; the local fixed revision has SHA-256 e57e500bea9c1eedbfdd2fb2879aed657bbab5c94aa83911210da499d0797f90."
sources = ["usaf-band-defense", "usaf-band-commons"]

[[facts]]
text = "The composition was first published on September 11, 1914. This date does not establish the printing date of the preserved revised edition."
sources = ["washington-university-first-edition", "copyright-catalog-1914"]

[[facts]]
text = "The Gaylord Music Library at Washington University in St. Louis preserves a six-page 1914 Pace & Handy Memphis issue. Its cover and first music page identify Memphis as the place of publication; unlike Brown's 1918 New York issue, it has no 1918 copyright-transfer line, record catalog numbers, or 'As played by Handy's Orchestra' heading. The copy matches Fuld's bibliographic description of the first edition, while a reproduced Handy interview describes the first title page as deep blue with white lettering. This supports—but does not conclusively establish—the identification as a first edition; the precise printing or impression of the Washington University copy remains unverified."
sources = ["washington-university-first-edition", "brown-score", "fuld-world-famous-music", "handy-first-cover-interview"]

[[facts]]
text = "IMSLP file #716402 is a 12-page scan containing a scenic-cover issue and a Paul Whiteman promotional issue, each followed by four score pages and an advertising back cover."
sources = ["imslp-score-716402"]

[[facts]]
text = "Rube Bloom arranged St. Louis Blues for solo piano; Alfred & Co. published the eight-page arrangement in 1928."
sources = ["imslp-bloom-arrangement"]

[[facts]]
text = "David Edward Kemp arranged St. Louis Blues for soprano, alto, tenor, and bass recorders and licensed the score and parts under CC BY-SA 4.0."
sources = ["imslp-kemp-arrangement"]

[[facts]]
text = "Dadvid published a synthesized performance of David Kemp's recorder arrangement under CC BY 4.0 on November 5, 2020."
sources = ["imslp-kemp-performance"]

[[facts]]
text = "Duke University Libraries preserves a six-image Rudy Vallée promotional edition for voice, piano, and ukulele and marks it No Copyright - United States."
sources = ["duke-score"]

[[facts]]
text = "The reference recording features the Original Dixieland Jazz Band and vocalist Al Bernard and was recorded on May 25, 1921."
sources = ["recording-catalog"]

[[facts]]
text = "The recording was issued by Victor as catalog number 18772 from matrix B-25412, take 2."
sources = ["recording-catalog"]

[[facts]]
text = "The Library of Congress states that US sound recordings published before 1923 entered the public domain on January 1, 2022."
sources = ["jukebox-rights"]

[[facts]]
text = "Ted Lewis Jazz Band recorded an instrumental St. Louis blues on December 7, 1922; Columbia issued it as catalog A3790 from matrix 80711, take 2."
sources = ["ted-lewis-recording-catalog"]

[[facts]]
text = "Bessie Smith recorded St. Louis Blues on January 14, 1925; Columbia released it in 1925 as catalog 14064-D."
sources = ["bessie-smith-archive", "bessie-smith-smithsonian"]

[[facts]]
text = "Frank Ferera and John Paaluhi recorded The St. Louis Blues as a Hawaiian guitar duet on September 4, 1925."
sources = ["ferera-paaluhi-gutenberg"]

[[facts]]
text = "W. C. Handy performed St. Louis Blues on The Ed Sullivan Show on February 6, 1949."
sources = ["ed-sullivan-youtube"]

[[facts]]
text = "Marion Harris recorded St. Louis Blues with an orchestra conducted by Charles Prince in New York City on April 16, 1920; Columbia issued it as A2944."
sources = ["marion-harris-youtube"]

