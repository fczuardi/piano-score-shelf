rights = "Public Domain Mark 1.0"
rights_url = "https://creativecommons.org/publicdomain/mark/1.0/"
attribution = "Gaylord Music Library, Washington University in St. Louis"
snapshot_note = "Washington University catalogs this as a 1914 six-page score for medium voice and piano, published in Memphis by Pace & Handy Music Co. The scan itself retains the Memphis imprint and original MCMXIV copyright without the 1918 transfer statement printed in Brown's later New York issue. Its identification as an apparent first edition is a bibliographic inference documented separately, not an edition statement in Washington University's catalog."

