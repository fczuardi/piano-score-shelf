snapshot_note = "The article reproduces an interview in which Handy recalls that the song's first title page was deep blue with white lettering and discusses the original printing. This is a secondary online reproduction of Handy's statement and corroborates the cover characteristic; it does not identify the Washington University copy's precise printing."

[[facts]]
