[work]
slug = "st-louis-blues"
title = "St. Louis Blues"
creators = ["W. C. Handy"]
summary = "Sheet music and a historical reference recording for study."
research_date = "2026-10-10"
rights_note = "The evidence supports US public-domain use of the score editions and the 1916, 1921, 1922, 1925, 1994, 1996, and 1997 recordings listed as reviewed here. Washington University in St. Louis and the Internet Archive mark the preserved 1914 Pace & Handy Memphis issue with the Public Domain Mark. IMSLP marks file #716402 and its Handy Bros. material Public Domain; the downloaded file contains two later six-page issues that are displayed separately. Brown marks its 1918 Pace & Handy issue No Copyright - United States. Duke marks its six-image Rudy Vallée promotional edition as Free Re-Use and No Copyright - United States, with attribution to Duke University Libraries. Wikimedia Commons identifies J. Lawrence Cook's 1930 arrangement as public domain in the United States because its copyright was not renewed. The Library of Congress states that US sound recordings published from 1923 through 1946 are protected for 100 years; the 1925 recordings therefore entered the US public domain on January 1, 2026. Project Gutenberg also explicitly identifies the Ferera and Paaluhi recording as public domain in the USA. Strong evidence supports US public-domain status for the three Air Force tracks because the Air Force distributes them through its Public Domain Music collection. For the 1997 track, Commons additionally records the Air Force's representation that its transcription, performance, and recording are official-duty federal works. These are evidence-based conclusions, not unconditional legal guarantees; Commons notes that the Air Force-supplied metadata was not necessarily independently verified. UCSB Library explicitly lists Jimmy Joy and the St. Anthony Hotel Orchestra's 1925 OKeh 40539 recording as public domain in the United States as of January 1, 2026; its DAHR record identifies matrix 9377, take A, recorded in Dallas in September 1925. LOC’s National Jukebox Data Package includes the 1916 Victor Military Band Joe Turner blues medley containing St. Louis blues, and assesses the dataset recordings as public domain based on their metadata dates. For Handy’s January 1922 session, LOC supplies a Registry excerpt and historical identification, while UCSB’s Black Swan discography documents a corresponding issue by May 20, 1922. This supports a U.S. public-domain assessment under the pre-1923 publication rule; LOC does not specify the excerpt’s exact take. The 1929 film is linked from the Library of Congress rather than hosted locally, with its US public-domain assessment documented separately. The 1958 Paramount film remains copyrighted and is only linked to a third-party YouTube upload; no copy is downloaded, hosted, or offered for redistribution by this project. Recording and publication dates are distinct. Copyright status may differ outside the United States."

[[score_editions]]
title = "Pace & Handy 1914 Memphis issue — apparent first edition"
source = "washington-university-first-edition"
artifacts = ["washu-first-edition-page-1", "washu-first-edition-page-2", "washu-first-edition-page-3", "washu-first-edition-page-4", "washu-first-edition-page-5", "washu-first-edition-page-6"]
note = "Six-page voice-and-piano issue published by Pace & Handy Music Co. in Memphis in 1914. The cover retains the Memphis imprint, and the first music page prints only the original MCMXIV copyright—not the 1918 copyright-transfer line found in Brown's later New York issue. The scan matches Fred E. Fuld's published description of the first edition, and a reproduced Handy interview says its first title page was deep blue with white lettering. Neither source establishes that this particular physical copy belongs to the first printing, so it is described here as an apparent first edition with its precise impression unverified. The scan is preserved by the Gaylord Music Library, Washington University in St. Louis."

[[score_editions]]
title = "Pace & Handy issue"
source = "brown-score"
artifacts = ["brown-score-page-1", "brown-score-page-2", "brown-score-page-3", "brown-score-page-4", "brown-score-page-5", "brown-score-page-6"]
note = "Six-page 1918 voice-and-piano issue published by Pace & Handy Music Co. Brown's record describes it as played by Handy's orchestra and marks it No Copyright - United States."

[[score_editions]]
title = "Handy Bros. scenic-cover issue"
source = "imslp-score-716402"
artifacts = ["imslp-716402-page-1", "imslp-716402-page-2", "imslp-716402-page-3", "imslp-716402-page-4", "imslp-716402-page-5", "imslp-716402-page-6"]
note = "The first six pages of IMSLP #716402: scenic front cover, four score pages, and an advertising back cover. IMSLP labels the containing PDF 'First edition' and dates it 1914, apparently using the composition's copyright date. Visual evidence shows that this Handy Bros. issue is later: it includes a ukulele arrangement and postdates the original Pace & Handy Memphis issue. Its precise publication date remains unverified."

[[score_editions]]
title = "Paul Whiteman promotional issue"
source = "imslp-score-716402"
artifacts = ["imslp-716402-page-7", "imslp-716402-page-8", "imslp-716402-page-9", "imslp-716402-page-10", "imslp-716402-page-11", "imslp-716402-page-12"]
note = "The second six pages bundled in IMSLP #716402: Paul Whiteman front cover, four score pages, and an advertising back cover. It is kept distinct from the scenic-cover issue even though IMSLP distributes both in one PDF."

[[score_editions]]
title = "Handy Bros. revised edition"
source = "score-archive"
artifacts = ["score-pdf-page-1", "score-pdf-page-2", "score-pdf-page-3", "score-pdf-page-4"]
note = "Four-page revised edition for voice and piano with ukulele chord diagrams in D tuning; exact printing date unverified. The cover explicitly says Revised Edition and Ukulele Arrangement and promotes Marion Harris's Columbia record 2944, recorded in 1920, so this is not an original 1914 printing. The first music page prints Copyright MCMXIV by W. C. Handy and Handy Bros. Music Co., Inc., 1547 Broadway, N.Y.C.; that copyright date does not establish the date of this revised printing. No 1942 renewal notice or Abner Silver credit was found on these four pages. These JPEGs are display derivatives rendered from the preserved PDF at 150 DPI with Poppler pdftoppm; the PDF remains the canonical downloaded artifact."

[[score_editions]]
title = "Rudy Vallée promotional edition"
source = "duke-score"
artifacts = ["duke-score-page-1", "duke-score-page-2", "duke-score-page-3", "duke-score-page-4", "duke-score-page-5", "duke-score-page-6"]
note = "Six-page voice, piano, and ukulele edition: illustrated front cover, four score pages, and an advertising back cover. Duke dates the underlying work to 1914; this physical edition is later and remains undated here pending further research."

