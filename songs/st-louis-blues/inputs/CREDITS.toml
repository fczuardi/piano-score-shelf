[[facts]]
text = "The 1945 MGM Tom and Jerry short Flirty Birdy, directed by William Hanna and Joseph Barbera with music by Scott Bradley, quotes St. Louis Blues. In the supplied YouTube copy, the passage runs from 1:50 to 2:51."
sources = ["iad-flirty-birdy", "youtube-flirty-birdy"]

[[facts]]
text = "Vignette Films produced a thirteen-minute educational film about W. C. Handy. The supplied YouTube listing dates it to 1967 and identifies Steve Allen as narrator."
sources = ["criterion-wc-handy-film", "youtube-wc-handy-1967"]

[[facts]]
text = "Macmillan published W. C. Handy's Father of the Blues: An Autobiography in 1941; Arna Bontemps edited it and Abbe Niles supplied the foreword."
sources = ["internet-archive-father-of-the-blues", "smithsonian-father-of-the-blues"]

[[facts]]
text = "W. C. Handy's Father of the Blues musical autobiography was originally issued in 1953 from sessions recorded in 1952 and 1953. The documented 1980 DRG LP reissue includes two St. Louis Blues tracks, one featuring Katherine Handy Lewis."
