[rights]
statement = "To the extent that this transcription, engraving, editorial apparatus, and its digital files contain copyright or related rights owned by Fabricio C Zuardi, those rights are dedicated under CC0 1.0 Universal. The dedication does not apply to third-party rights. The underlying 1914 music and lyrics by W. C. Handy are public domain in the United States but may remain protected elsewhere through 2028."
source_status = "Washington University and Internet Archive mark the scanned 1914 source with the Public Domain Mark. That designation supports United States use but is not treated here as a worldwide rights clearance."
original_notice = "Copyright MCMXIV by W. C. Handy. Published by The Pace & Handy Music Co., Memphis, Tenn."
original_notice_context = "Transcribed from the footer of the primary witness as historical source information. It is distinct from the CC0 dedication covering this transcription and its editorial contributions."
font_plan = "Use MuseScore's Leland notation font and open text fonts distributed under the SIL Open Font License 1.1. Font software and other third-party components retain their own licenses and are not relicensed under CC0."

[editorial_policy]
music = "Preserve the printed pitches, rhythms, harmony, dynamics, articulations, repeats, tempo indications, and formal structure of the primary witness."
layout = "Reflow systems and pages for modern legibility; the new layout has no evidentiary authority."
lyrics = "Transcribe the historical lyrics as printed, including dialect spellings, and label them as a historical transcription. Any normalized or performance text must be issued as a separately identified editorial layer."
source_features = "Preserve the dedication, title, composer credit, expressive text, and other score-level information. Do not reproduce the scanned cover artwork as part of the CC0 engraving."
ambiguities = "Do not silently guess. Record every uncertain reading, correction, or departure from the primary witness in the decisions list."
measure_numbers = "Number measures continuously from the opening piano introduction to support review, lessons, and synchronization data."
playback = "Playback tempos are editorial realizations of the source's verbal tempo indications; witness A supplies no metronome values. Preserve the printed tempo text regardless of playback settings."

