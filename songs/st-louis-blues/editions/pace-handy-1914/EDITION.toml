note = "Completed and reviewed the Chorus, its two printed lyric lines, repeat endings, spoken interjection, D.C., and piano accompaniment. Encoded measure 49 as the one-beat Chorus pickup and measures 61 and 63 as irregular 3/8 measures under the prevailing 2/4 signature. Recorded the interpretation of the open-ended curves in measure 58 and the simplified chord-to-chord slur in measures 59-60. Corrected the closing barline to a final barline, regenerated the edition derivatives from the MuseScore working file, and completed a visual and structural review of the full score."

[[decisions]]
measure = 1
location = "piano left hand, beat 1"
witness = "A, scan page 2, system 1"
reading = "A shared G notehead has opposing stems and one visibly printed augmentation dot."
action = "Encode the upper-stem voice as a dotted eighth beamed to the following sixteenth and the lower-stem voice as a dotted quarter."
rationale = "Both contrapuntal durations require augmentation; the single printed dot is understood to apply to the coincident notes in both voices."

[[decisions]]
measure = 0
location = "piano left hand, pickup"
witness = "A, scan page 2, system 1"
reading = "The source prints an eighth rest followed by a sixteenth rest."
action = "Encode an eighth rest followed by a sixteenth rest."
rationale = "This preserves both the combined pickup duration and the order printed in the primary witness."

[[decisions]]
measure = 37
location = "piano right hand, beat 1"
witness = "A, scan page 4, system 1; collated with B, scan page 4, system 1"
reading = "The first two chords are joined by only one beam, although the dots on the second chord and the correctly printed vocal rhythm require a sixteenth followed by a dotted eighth. Witness B reproduces the omitted secondary beam."
action = "Add a secondary beam to the first chord, encoding it as a sixteenth-note chord followed by a dotted eighth tied to a quarter-note chord."
rationale = "The corrected values complete the 2/4 measure and match the vocal rhythm directly above while preserving the printed augmentation dots and ties."

[[decisions]]
measure = "43-46"
location = "piano left hand"
witness = "A, scan page 4, system 3"
reading = "The repeated accompaniment figure contains coincident noteheads, sparsely printed augmentation dots, and subtle rhythmic differences. The moving upper voice is read as dotted eighth, sixteenth, eighth, eighth in measures 43-45, but as four eighths in measure 46. The lower voice is read as a half-note D octave in measure 43, a dotted-quarter D octave in measure 44, a quarter-note D octave in measure 45, and a dotted-quarter low D in measure 46; unprinted rests complete the latter measures."
action = "Preserve those distinct durations in separate voices. Where the voices coincide in measure 43, use shared visual noteheads while retaining their independent rhythmic values; show the rests needed to make the later voices explicit."
rationale = "This reading accounts for the source's hollow and filled noteheads, the placement of its dots and beams, and the complete duration of each 2/4 measure without regularizing the visibly non-identical figures."

[[decisions]]
measure = 58
location = "piano left hand, chord at the end of the source system"
witness = "A, scan page 5, system 3; collated with B, scan page 5, system 3"
reading = "Three open-ended curves extend from the chord to the end of the system. The following chord contains different pitches, so the curves cannot be ordinary ties into measure 59. Witness B reproduces the same notation."
action = "Encode the three curves as extended laissez vibrer ties, one for each chord tone."
rationale = "The open-ended ties preserve the source's indication that the chord should continue resonating without falsely connecting it to different pitches in the following measure."

[[decisions]]
measure = "59-60"
location = "piano left hand, chord-to-chord connection"
witness = "A, scan page 5, systems 3-4"
reading = "The source prints separate curves for the upper and lower voice-leading strands between chords containing different pitches."
action = "Represent the two printed voice-leading curves with a single chord-to-chord slur."
rationale = "MuseScore attaches slurs to chord events rather than individual noteheads in a single voice. A single encompassing slur preserves the intended legato connection without introducing artificial voices or misrepresenting a changing pitch as a tie."

[[decisions]]
measure = "61 and 63"
location = "first and second endings of the Chorus"
witness = "A, scan page 5, system 4"
reading = "The piano rhythm makes each closing ending measure three eighth notes long although the prevailing 2/4 signature is not replaced. The vocal staff is blank in measure 61 and contains a quarter note followed by an eighth rest in measure 63."
action = "Encode both measures with an actual duration of 3/8 while retaining the displayed 2/4 signature. Add a visible dotted-quarter rest to the otherwise blank vocal measure 61 and attach the unpitched spoken text 'Dog-gone-it!' to that rest."
rationale = "The irregular durations preserve the barlines and complete piano rhythms printed in the source; the explicit vocal rest clarifies the modern engraving without assigning a pitch or fixed rhythm to the spoken interjection."
