title = "St. Louis Blues — Pace & Handy 1914 Memphis edition"
composer = "W. C. Handy"
kind = "faithful modern engraving"
status = "work-in-progress"
started = "2026-10-10"
transcriber = "Fabricio C Zuardi"
current_scope = "Transcribed and reviewed through measure 18, the end of scan page 2 system 3; remaining measures are placeholders"
canonical_format = "MusicXML 4.0"
