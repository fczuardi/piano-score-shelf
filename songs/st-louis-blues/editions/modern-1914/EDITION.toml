[edition]
id = "modern-1914"
title = "St. Louis Blues — modern study edition"
composer = "W. C. Handy"
kind = "faithful modern engraving"
status = "work-in-progress"
started = "2026-10-02"
transcriber = "Fabricio C Zuardi"
current_scope = "Piano entered and reviewed through measure 52, with chorus piano in progress; vocal, lyric, and harmony work extends to the ending"
canonical_format = "MusicXML 4.0"
canonical_file = "st-louis-blues.musicxml"
working_file = "st-louis-blues.mscz"
license = "CC0-1.0"
license_url = "https://creativecommons.org/publicdomain/zero/1.0/"

[rights]
statement = "CC0 applies to this project's transcription, engraving, metadata, and editorial contributions. It does not alter rights in the underlying composition where that work remains protected. The underlying composition is public domain in the United States; its status may differ elsewhere."
font_plan = "Use MuseScore's Leland notation font and an open text font distributed under the SIL Open Font License 1.1. Font software retains its own license and is not relicensed under CC0."

[editorial_policy]
music = "Preserve the printed pitches, rhythms, harmony, dynamics, articulations, repeats, and formal structure of the primary witness."
layout = "Reflow systems and pages for modern legibility; layout has no evidentiary authority."
lyrics = "Transcribe the historical lyrics as printed, including dialect spellings, and label them as a historical transcription. Any normalized or performance text must be issued as a separately identified editorial layer."
ukulele = "Preserve the printed ukulele chord symbols and diagrams when they can be read confidently."
ambiguities = "Do not silently guess. Record every unresolved or corrected reading in the decisions list before publishing a release."
measure_numbers = "Number measures continuously from the opening piano introduction to support lessons, video chapters, and synchronization data."

[[witnesses]]
id = "A"
role = "primary"
description = "1914 Handy Bros. scenic-cover issue; four score pages between the cover and advertisement."
source_id = "imslp-score-716402"
artifact_ids = [
  "imslp-716402-page-2",
  "imslp-716402-page-3",
  "imslp-716402-page-4",
  "imslp-716402-page-5",
]

[[witnesses]]
id = "B"
role = "collation"
description = "Brown University Library's 1918 Pace & Handy issue, used to clarify readings rather than silently replace the primary witness."
source_id = "brown-score"
artifact_ids = [
  "brown-score-page-2",
  "brown-score-page-3",
  "brown-score-page-4",
  "brown-score-page-5",
]

[outputs]
pdf = "build/st-louis-blues-modern-1914.pdf"
