{% extends "base.html" %}
{% block title %}{{ page.title }} — {{ config.title }}{% endblock title %}
{% block description %}{{ page.description }}{% endblock description %}
{% block content %}
  <article class="experiment">
    <h1>{{ page.title }}</h1>
    {{ page.content | safe }}
  </article>
  <style>
    .experiment table { display: block; overflow-x: auto; }
    .experiment td { overflow-wrap: anywhere; min-width: 7rem; }
  </style>
{% endblock content %}
